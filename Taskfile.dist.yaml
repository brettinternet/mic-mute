---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  PROJECT_DIR:
    sh: git rev-parse --show-toplevel

# Pinned versions of the cargo-installed tools.
dotenv: [scripts/cargo-tools.env]

env:
  ROOT_DIR: "{{.PROJECT_DIR}}"

includes:
  setup: .taskfiles/setup.yaml

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task -l

  init:
    desc: Install dependencies and setup project
    aliases: [setup]
    deps:
      - task: setup:init

  start:
    desc: Compile, run and watch for changes
    aliases: [watch, run]
    cmds:
      - watchexec -e rs,toml -- cargo run
    env:
      RUST_BACKTRACE: 1
      RUST_LOG: trace

  debug:
    desc: Build and run the debug binary once, with trace logging
    cmds:
      - cargo build --locked
      - '"${CARGO_TARGET_DIR:-target}/debug/mic-mute"'
    env:
      RUST_BACKTRACE: 1
      RUST_LOG: trace

  check:
    desc: Lint with clippy and check formatting
    aliases: [lint]
    cmds:
      - cargo clippy --locked --release -- -D warnings
      - cargo fmt -- --check

  fix:
    desc: Fix lint and formatting issues
    cmds:
      - cargo clippy --locked --release --fix --allow-dirty --allow-staged -- -D warnings
      - cargo fmt

  test:
    desc: Run the tests
    cmds:
      - cargo test --locked

  build:
    desc: Build, bundle, and ad-hoc sign Mic Mute.app for this Mac, then show it in Finder (UNIVERSAL=1 builds for Apple silicon and Intel; NO_OPEN=1 skips Finder)
    cmds:
      # The script installs the pinned cargo-bundle when it's missing.
      - ./scripts/install.sh --bundle-only --skip-checks{{if .UNIVERSAL}} --universal{{end}}
      - cmd: open "${CARGO_TARGET_DIR:-target}/{{ .BUNDLE_TARGET }}/release/bundle/osx"
        if: '[ -z "{{.NO_OPEN}}" ]'
    vars:
      # Where scripts/install.sh puts the bundle: cargo bundle's "universal" directory, or
      # this Mac's target (Apple silicon whenever sysctl reports it, as in the script).
      BUNDLE_TARGET:
        sh: |
          if [ -n "{{.UNIVERSAL}}" ]; then
            echo universal
          elif [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = 1 ]; then
            echo aarch64-apple-darwin
          else
            echo x86_64-apple-darwin
          fi

  install:
    desc: Check, build, sign, install, and launch Mic Mute.app (flags after --; see README)
    cmds:
      - ./scripts/install.sh {{.CLI_ARGS}}

  uninstall:
    desc: Stop Mic Mute, then remove the app and its login item (-- --purge also deletes settings)
    cmds:
      - ./scripts/uninstall.sh {{.CLI_ARGS}}

  release:
    desc: Clean, then build a universal DMG (Apple silicon and Intel) signed with your self-signed sign.crt (see README)
    cmds:
      - task: release-dependencies
      - cargo clean
      - task: release-target
    env:
      RUST_LOG: warn

  release-dependencies:
    internal: true
    desc: Release dependencies
    cmds:
      - cargo install --locked apple-codesign@{{.APPLE_CODESIGN_VERSION}}
      - cargo install --locked toml-cli@{{.TOML_CLI_VERSION}}
    status:
      - ./scripts/check-tool-version.sh rcodesign {{.APPLE_CODESIGN_VERSION}}
      - ./scripts/check-tool-version.sh toml {{.TOML_CLI_VERSION}}

  release-target:
    internal: true
    cmds:
      # Builds both targets with --locked, combines them with lipo, checks the architectures,
      # bundles, and signs ad hoc; rcodesign then replaces that signature.
      - ./scripts/install.sh --bundle-only --skip-checks --universal
      - rcodesign sign --pem-source {{ .PEM_FILE }} "{{ .BUNDLE_DIR }}/Mic Mute.app"
      - hdiutil create -volname {{ .TITLE }} -srcfolder "{{ .BUNDLE_DIR }}" -ov -format UDZO {{ .TITLE }}.dmg
      # - rcodesign sign --pem-source {{ .PEM_FILE }} {{ .TITLE }}.dmg
    env:
      RUST_LOG: warn
    vars:
      PEM_FILE: sign.crt
      # cargo bundle's directory for a bundle built for several targets.
      BUNDLE_DIR:
        sh: echo "${CARGO_TARGET_DIR:-target}/universal/release/bundle/osx"
      NAME:
        sh: toml get Cargo.toml package.name --raw
      VERSION:
        sh: toml get Cargo.toml package.version --raw
      TITLE: "{{ .NAME }}-{{ .VERSION }}-universal-apple-darwin"

  clean:
    desc: Delete the build artifacts (cargo clean)
    cmds:
      - cargo clean
