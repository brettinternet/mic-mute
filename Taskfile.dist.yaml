---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  PROJECT_DIR:
    sh: git rev-parse --show-toplevel

# Pinned versions of the cargo-installed tools.
dotenv: [scripts/cargo-tools.env]

env:
  ROOT_DIR: "{{.PROJECT_DIR}}"

includes:
  setup: .taskfiles/setup.yaml

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task -l

  init:
    desc: Install dependencies and setup project
    aliases: [setup]
    deps:
      - task: setup:init

  start:
    desc: Compile, run and watch for changes
    aliases: [watch, run]
    cmds:
      - watchexec -e rs,toml -- cargo run
    env:
      RUST_BACKTRACE: 1
      RUST_LOG: trace

  debug:
    desc: Build and run the debug binary once, with trace logging
    cmds:
      - cargo build --locked
      - '"${CARGO_TARGET_DIR:-target}/debug/mic-mute"'
    env:
      RUST_BACKTRACE: 1
      RUST_LOG: trace

  check:
    desc: Lint with clippy and check formatting
    aliases: [lint]
    cmds:
      - cargo clippy --locked --release -- -D warnings
      - cargo fmt -- --check

  fix:
    desc: Fix lint and formatting issues
    cmds:
      - cargo clippy --locked --release --fix --allow-dirty --allow-staged -- -D warnings
      - cargo fmt

  test:
    desc: Run the tests
    cmds:
      - cargo test --locked

  build:
    desc: Build and bundle Mic Mute.app, then show it in Finder (NO_OPEN=1 skips Finder)
    cmds:
      - task: build-dependencies
      - task: build-target
        vars:
          TARGET: aarch64-apple-darwin

  build-dependencies:
    internal: true
    desc: Install the pinned cargo-bundle
    cmds:
      - cargo install --locked cargo-bundle@{{.CARGO_BUNDLE_VERSION}}
    status:
      - ./scripts/check-tool-version.sh cargo-bundle {{.CARGO_BUNDLE_VERSION}}

  build-target:
    internal: true
    cmds:
      - cargo build --locked --release --target {{ .TARGET }}
      - cargo bundle --release --target {{ .TARGET }} --format osx
      - cmd: open "${CARGO_TARGET_DIR:-target}/{{ .TARGET }}/release/bundle/osx"
        if: '[ -z "{{.NO_OPEN}}" ]'

  install:
    desc: Check, build, sign, install, and launch Mic Mute.app (flags after --; see README)
    cmds:
      - ./scripts/install.sh {{.CLI_ARGS}}

  uninstall:
    desc: Stop Mic Mute, then remove the app and its login item (-- --purge also deletes settings)
    cmds:
      - ./scripts/uninstall.sh {{.CLI_ARGS}}

  release:
    desc: Clean, then build a DMG signed with your self-signed sign.crt (see README)
    cmds:
      - task: release-dependencies
      - cargo clean
      - task: release-target
        vars:
          TARGET: aarch64-apple-darwin
    env:
      RUST_LOG: warn

  release-dependencies:
    internal: true
    desc: Release dependencies
    cmds:
      - cargo install --locked apple-codesign@{{.APPLE_CODESIGN_VERSION}}
      - cargo install --locked toml-cli@{{.TOML_CLI_VERSION}}
    status:
      - ./scripts/check-tool-version.sh rcodesign {{.APPLE_CODESIGN_VERSION}}
      - ./scripts/check-tool-version.sh toml {{.TOML_CLI_VERSION}}

  release-target:
    internal: true
    cmds:
      - cargo build --locked --release --target {{ .TARGET }}
      - cargo bundle --release --target {{ .TARGET }} --format osx
      - rcodesign sign --pem-source {{ .PEM_FILE }} "{{ .BUNDLE_DIR }}/Mic Mute.app"
      - hdiutil create -volname {{ .TITLE }} -srcfolder "{{ .BUNDLE_DIR }}" -ov -format UDZO {{ .TITLE }}.dmg
      # - rcodesign sign --pem-source {{ .PEM_FILE }} {{ .TITLE }}.dmg
    env:
      RUST_LOG: warn
    vars:
      PEM_FILE: sign.crt
      BUNDLE_DIR:
        sh: echo "${CARGO_TARGET_DIR:-target}/{{ .TARGET }}/release/bundle/osx"
      NAME:
        sh: toml get Cargo.toml package.name --raw
      VERSION:
        sh: toml get Cargo.toml package.version --raw
      TITLE: "{{ .NAME }}-{{ .VERSION }}-{{ .TARGET }}"

  clean:
    desc: Delete the build artifacts (cargo clean)
    cmds:
      - cargo clean
