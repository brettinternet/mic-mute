# cargo-deny configuration. CI runs only `cargo deny check advisories`
# (.github/workflows/audit.yaml); the licenses, bans, and sources checks are
# not configured.

[graph]
# The app ships for Apple silicon only. Without this, crates that are reachable
# only on other platforms (e.g. proc-macro-error through GTK on Linux) would
# fail the check.
targets = ["aarch64-apple-darwin"]

[advisories]
# Vulnerability advisories always fail the check. Unmaintained and unsound
# advisories fail it too, for direct and transitive dependencies alike
# (cargo-deny's default for unsound covers direct dependencies only).
unmaintained = "all"
unsound = "all"
# Each entry needs a reason: { id = "RUSTSEC-YYYY-NNNN", reason = "..." }.
ignore = [
  # Both come in through async-std, whose only use is the popup's 1 s hide
  # timer. Remove them together with async-std.
  { id = "RUSTSEC-2025-0052", reason = "async-std: only the popup's hide timer uses it" },
  { id = "RUSTSEC-2026-0221", reason = "event-listener 5.4.1 comes in only through async-std" },
]
