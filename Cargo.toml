[package]
name = "mic-mute"
description = "System-wide mic mute for macOS"
version = "0.5.1"
edition = "2021"
# The highest rust-version among the dependencies: tray-icon 0.26 and muda 0.21. The crate itself
# needs 1.88 (`as_chunks` in icons.rs).
rust-version = "1.90"
authors = ["Brett Gardiner"]
license = "MIT"

default-run = "mic-mute"

[dependencies]
log = "0.4"
env_logger = "0.11"
anyhow = "1"
tao = "0.37"
tray-icon = "0.26"
muda = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.48", default-features = false }
global-hotkey = "0.8"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.14"
objc2-core-audio = { version = "0.3", features = [
  "AudioHardware",
  "AudioHardwareDeprecated",
] }
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
] }
# SMAppService.mainApp (macOS 13+) for Launch at Login; NSError describes its failures.
# NSBundle tells the installed app from a bare executable, which can't post notifications.
# NSWorkspace's center and the distributed center deliver the session events; NSApplication
# shows or hides the Dock icon; NSURL opens Sound settings.
objc2 = "0.6"
# The popup, the About window, the Settings window (its shortcut recorder watches keys with an
# NSEvent monitor, a block), the mute sounds, the session events (NSWorkspace's center), the
# Dock toggle (NSApplication), and the tray icon's size (NSStatusItem's button). NSView::layer
# needs objc2-quartz-core, NSColor::CGColor objc2-core-graphics.
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSGraphics",
  "NSGridView",
  "NSImage",
  "NSImageView",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSPopUpButton",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSSound",
  "NSStackView",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSStepper",
  "NSText",
  "NSTextField",
  "NSUserInterfaceLayout",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "bitflags",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
] }
# Camera-in-use detection (`camera.rs`); the crate links AVFoundation.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "AVCaptureDevice",
  "AVMediaFormat",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDistributedNotificationCenter",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSRange",
  "NSString",
  "NSURL",
  "objc2-core-foundation",
] }
# The popup separator's color: CALayer's backgroundColor setter is behind objc2-core-graphics,
# which objc2-app-kit doesn't turn on here.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "CALayer",
  "objc2-core-graphics",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
  "std",
  "SMAppService",
  "objc2",
  "objc2-foundation",
] }
# Notifications on a mute change (`show_notification`); the permission request and the post
# report back through blocks. The Settings window's key monitor is a block too.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNUserNotificationCenter",
] }

[package.metadata.bundle]
name = "Mic Mute"
identifier = "com.brettinternet.mic-mute"
icon = [
  "assets/icons/16x16.png",
  "assets/icons/16x16@2x.png",
  "assets/icons/32x32.png",
  "assets/icons/32x32@2x.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/256x256.png",
  "assets/icons/256x256@2x.png",
  "assets/icons/512x512.png",
  "assets/icons/512x512@2x.png",
]
copyright = "Copyright (c) Brett Gardiner 2023. All rights reserved."
category = "public.app-category.utilities"
short_description = "System-wide mic mute for macOS"
long_description = """
A system-wide mute for macOS microphones with a global shortcut and visual confirmation of mute status. Inspired by VCM for Windows.
"""

# cargo-bundle 0.12 rejects unknown keys; its macOS keys live in this table.
[package.metadata.bundle.osx]
minimum_system_version = "11.0"
url_schemes = ["com.brettinternet.mic-mute"]
# Appended verbatim inside Info.plist's <dict>. The path is relative to the
# working directory, so run `cargo bundle` from the repository root.
info_plist_exts = ["assets/Info.plist.ext"]
